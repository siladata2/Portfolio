<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — SILA TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2540;--mist:#eef3f6;--paper:#fff;--cobalt:#1f4bff;--sun:#ffb020;--muted:#566679;--line:#d8e1e8;--red:#c62828;--green:#1b7f4b;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 var(--body);color:var(--ink);background:var(--mist);min-height:100vh}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
h1,h2{font-family:var(--display);letter-spacing:-.02em}
a{color:var(--cobalt);text-decoration:none;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--display);color:var(--ink)}
.mark{width:30px;height:30px;border-radius:9px;background:var(--cobalt);color:#fff;display:grid;place-items:center}
.shell{width:min(1040px,100% - 32px);margin:32px auto 80px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,32px);margin-bottom:20px}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:600;margin-bottom:18px}
.login{max-width:400px;margin:8vh auto 0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-weight:600;font-size:14px}
input,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
input:focus,textarea:focus{border-color:var(--cobalt);outline:none}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted)}
.btn{font:600 15px var(--body);padding:11px 18px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.solid{background:var(--cobalt);color:#fff}.solid:hover{background:#1639cc}
.line{background:none;border-color:var(--line);color:var(--ink)}.line:hover{border-color:var(--ink)}
.danger{background:none;border-color:#f0c4c4;color:var(--red)}.danger:hover{background:var(--red);color:#fff}
.block{width:100%}
.msg{margin-top:12px;font-size:14px;min-height:20px}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.stat b{display:block;font:800 36px var(--display)}.stat span{color:var(--muted);font-size:14px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:18px}.check input{width:auto}
.tools{display:flex;gap:12px;margin-bottom:14px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.thumb{width:64px;height:48px;border-radius:10px;object-fit:cover;background:var(--ink);color:var(--sun);display:grid;place-items:center;font:800 22px var(--display)}
.rname{font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.pill.on{background:#dff3e8;color:var(--green)}.pill.off{background:#eceff3;color:var(--muted)}
.rmeta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.acts .btn{padding:7px 12px;font-size:14px}
.empty{padding:28px 0;color:var(--muted);text-align:center}
dialog{border:0;border-radius:18px;padding:28px;width:min(560px,100% - 32px);color:var(--ink)}
dialog::backdrop{background:rgba(10,37,64,.55)}
[hidden]{display:none!important}
@media(max-width:640px){.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:14px}.stat b{font-size:28px}.row{grid-template-columns:48px 1fr}.thumb{width:48px;height:38px}.acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="top"><span class="brand"><span class="mark">/</span>SILA TECH admin</span><a href="/">View site</a></div>

<div class="shell">
  <section id="login" class="box login" hidden>
    <h1>Sign in</h1>
    <form id="loginForm" style="margin-top:22px">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn solid block" type="submit">Sign in</button>
      <p class="msg" id="loginMsg" role="status"></p>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="head"><h1>Projects</h1><button class="btn line" id="logout">Sign out</button></div>
    <div class="stats">
      <div class="stat"><b id="sT">–</b><span>Total</span></div>
      <div class="stat"><b id="sA">–</b><span>Live</span></div>
      <div class="stat"><b id="sH">–</b><span>Hidden</span></div>
    </div>

    <div class="box">
      <h2>Add a project</h2>
      <form id="addForm">
        <div class="two">
          <div class="field"><label for="aName">Name</label><input id="aName" name="name" placeholder="SILA MD" required></div>
          <div class="field"><label for="aPath">Path</label><input id="aPath" name="path" placeholder="/bot" required><span class="hint">Visitors open it at silatech.site/bot</span></div>
          <div class="field full"><label for="aTarget">Target URL</label><input id="aTarget" name="target" type="url" placeholder="https://your-app.example.com" required><span class="hint">The server that actually runs the project.</span></div>
          <div class="field full"><label for="aDesc">Description</label><textarea id="aDesc" name="description" maxlength="400" placeholder="What this project does"></textarea></div>
          <div class="field"><label for="aPost">Post link (optional)</label><input id="aPost" name="postUrl" type="url" placeholder="https://"></div>
          <div class="field"><label for="aImg">Cover image (max 2 MB)</label><input id="aImg" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
        </div>
        <div class="check"><input type="checkbox" id="aActive" checked><label for="aActive">Show on the live site</label></div>
        <button class="btn solid" type="submit">Add project</button>
        <p class="msg" id="addMsg" role="status"></p>
      </form>
    </div>

    <div class="box">
      <h2>All projects</h2>
      <div class="tools"><input id="q" type="search" placeholder="Search by name or path" aria-label="Search projects"></div>
      <div id="list"></div>
    </div>
  </section>
</div>

<dialog id="dlg">
  <h2>Edit project</h2>
  <form id="editForm">
    <div class="two">
      <div class="field"><label for="eName">Name</label><input id="eName" name="name" required></div>
      <div class="field"><label for="ePath">Path</label><input id="ePath" name="path" required></div>
      <div class="field full"><label for="eTarget">Target URL</label><input id="eTarget" name="target" type="url" required></div>
      <div class="field full"><label for="eDesc">Description</label><textarea id="eDesc" name="description" maxlength="400"></textarea></div>
      <div class="field"><label for="ePost">Post link</label><input id="ePost" name="postUrl" type="url"></div>
      <div class="field"><label for="eImg">Replace image</label><input id="eImg" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
    </div>
    <div class="check" id="rmRow"><input type="checkbox" id="eRm"><label for="eRm">Remove current image</label></div>
    <div class="acts" style="justify-content:flex-start;gap:12px">
      <button class="btn solid" type="submit">Save changes</button>
      <button class="btn line" type="button" id="eCancel">Cancel</button>
    </div>
    <p class="msg" id="editMsg" role="status"></p>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(url, opt = {}) {
  const r = await fetch(url, opt);
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(d.error || "Request failed."); e.status = r.status; throw e; }
  return d;
}
const say = (el, text, kind = "") => { el.className = "msg " + kind; el.textContent = text; };

let projects = [];

async function start() {
  try { await load(); show(true); }
  catch (e) { show(false); if (e.status !== 401) say($("#loginMsg"), e.message, "err"); }
}
function show(authed) { $("#login").hidden = authed; $("#dash").hidden = !authed; }

$("#loginForm").onsubmit = async (e) => {
  e.preventDefault();
  say($("#loginMsg"), "Signing in…");
  try {
    await api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#u").value, password: $("#p").value }) });
    $("#p").value = "";
    say($("#loginMsg"), "");
    await load(); show(true);
  } catch (err) { say($("#loginMsg"), err.message, "err"); }
};
$("#logout").onclick = async () => { await api("/api/logout", { method: "POST" }); show(false); };

async function load() {
  projects = (await api("/api/admin/projects")).projects || [];
  render();
}

function render() {
  $("#sT").textContent = projects.length;
  $("#sA").textContent = projects.filter((p) => p.active).length;
  $("#sH").textContent = projects.filter((p) => !p.active).length;
  const q = $("#q").value.trim().toLowerCase();
  const rows = projects.filter((p) => !q || (p.name + p.path).toLowerCase().includes(q));
  $("#list").innerHTML = rows.length ? rows.map((p) => `
    <div class="row">
      ${p.imageUrl ? `<img class="thumb" src="${esc(p.imageUrl)}" alt="">` : `<div class="thumb">${esc((p.name || "?")[0].toUpperCase())}</div>`}
      <div>
        <div class="rname">${esc(p.name)} <span class="pill ${p.active ? "on" : "off"}">${p.active ? "Live" : "Hidden"}</span></div>
        <div class="rmeta"><a href="${esc(p.path)}" target="_blank" rel="noopener">${esc(p.path)}</a> → ${esc(p.target)}</div>
      </div>
      <div class="acts">
        <button class="btn line" data-a="edit" data-id="${esc(p._id)}">Edit</button>
        <button class="btn line" data-a="toggle" data-id="${esc(p._id)}">${p.active ? "Hide" : "Show"}</button>
        <button class="btn danger" data-a="del" data-id="${esc(p._id)}">Delete</button>
      </div>
    </div>`).join("") : `<p class="empty">${projects.length ? "No projects match your search." : "No projects yet. Add your first one above."}</p>`;
}
$("#q").oninput = render;

$("#list").onclick = async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.dataset.id;
  try {
    if (b.dataset.a === "edit") return openEdit(id);
    if (b.dataset.a === "toggle") await api(`/api/admin/projects/${id}/toggle`, { method: "PATCH" });
    if (b.dataset.a === "del") {
      const p = projects.find((x) => x._id === id);
      if (!confirm(`Delete “${p ? p.name : "this project"}”? This can’t be undone.`)) return;
      await api(`/api/admin/projects/${id}`, { method: "DELETE" });
    }
    await load();
  } catch (err) { alert(err.message); }
};

$("#addForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target, m = $("#addMsg");
  say(m, "Adding project…");
  try {
    const fd = new FormData(f);
    fd.set("active", $("#aActive").checked);
    await api("/api/admin/projects", { method: "POST", body: fd });
    f.reset(); $("#aActive").checked = true;
    say(m, "Project added.", "ok");
    await load();
  } catch (err) { say(m, err.message, "err"); }
};

let editId = null;
function openEdit(id) {
  const p = projects.find((x) => x._id === id); if (!p) return;
  editId = id;
  $("#eName").value = p.name || ""; $("#ePath").value = p.path || ""; $("#eTarget").value = p.target || "";
  $("#eDesc").value = p.description || ""; $("#ePost").value = p.postUrl || "";
  $("#eImg").value = ""; $("#eRm").checked = false; $("#rmRow").hidden = !p.imageUrl;
  say($("#editMsg"), "");
  $("#dlg").showModal();
}
$("#eCancel").onclick = () => $("#dlg").close();
$("#editForm").onsubmit = async (e) => {
  e.preventDefault();
  const m = $("#editMsg");
  say(m, "Saving…");
  try {
    const fd = new FormData(e.target);
    fd.set("removeImage", $("#eRm").checked);
    await api(`/api/admin/projects/${editId}`, { method: "PUT", body: fd });
    $("#dlg").close();
    await load();
  } catch (err) { say(m, err.message, "err"); }
};

start();
</script>
</body>
</html>
